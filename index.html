<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klang Valley Route Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#E8ECF2; --panel:#FFFFFF; --map:#F8F9FB; --ink:#141C33; --muted:#586179; --rule:#D8DDE6;
  --accent:#23307A; --accent-ink:#FFFFFF; --field:#F1F3F7; --dot:#FFFFFF; --halo:#F8F9FB;
  --hub:#1A2340; --focus:#3D5BFF; --warn:#9A3412; --dim:.2;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0F18; --panel:#121827; --map:#151C2B; --ink:#E7EAF2; --muted:#9AA3B8; --rule:#273048;
    --accent:#B3C2FF; --accent-ink:#0B0F18; --field:#1A2235; --dot:#F4F6FA; --halo:#151C2B;
    --hub:#070A12; --focus:#8EA2FF; --warn:#FDBA74; --dim:.26;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F18; --panel:#121827; --map:#151C2B; --ink:#E7EAF2; --muted:#9AA3B8; --rule:#273048;
  --accent:#B3C2FF; --accent-ink:#0B0F18; --field:#1A2235; --dot:#F4F6FA; --halo:#151C2B;
  --hub:#070A12; --focus:#8EA2FF; --warn:#FDBA74; --dim:.26;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(320px,380px) 1fr;gap:16px;height:100%;padding:16px}
.panel{background:var(--panel);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--rule)}
.panel-scroll{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:20px;min-height:0}
.p-top,.p-bottom{display:flex;flex-direction:column;gap:20px}
.stepwrap>summary{cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:4px;margin-bottom:10px;width:max-content}
.stepwrap:not([open])>summary{margin-bottom:0}

.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-family:var(--label);font-weight:700;font-size:28px;line-height:1.1;text-wrap:balance}

.trip{display:grid;grid-template-columns:22px 1fr 40px;grid-template-rows:auto auto;column-gap:10px;row-gap:8px;align-items:center}
.pin{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--ink);color:var(--panel)}
.pin.b{background:transparent;border:2.5px solid var(--ink);color:var(--ink)}
.rail{grid-column:1;grid-row:1 / span 2;justify-self:center;width:2px;height:40px;background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 7px);align-self:center}
.pins{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding-block:12px;position:relative}
.pins::before{content:"";position:absolute;top:34px;bottom:34px;width:2px;background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 7px)}
.field{position:relative}
.field label{position:absolute;left:12px;top:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;pointer-events:none}
.field input{width:100%;border:1px solid var(--rule);background:var(--field);border-radius:10px;padding:22px 34px 8px 12px;font-size:16px;font-weight:500}
.field input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.clear-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:26px;height:26px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.clear-x:hover{background:var(--rule)}
.swap{grid-column:3;grid-row:1 / span 2;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.swap:hover{background:var(--field)}
.swap svg{width:18px;height:18px}

.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 32px rgba(10,16,40,.18);max-height:300px;overflow-y:auto;padding:4px;margin:0;list-style:none}
.suggest li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--field)}
.suggest mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:var(--focus)}
.suggest .empty{color:var(--muted);cursor:default}
.badges{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding-inline:5px;border-radius:11px;font-size:12px;font-weight:700;color:#fff;font-family:var(--label);line-height:1}
.badge.lg{min-width:28px;height:28px;border-radius:14px;font-size:14px}

.actions{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{flex:0 0 auto;background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{background:var(--field)}
.msg{font-size:14px;color:var(--warn);margin:0}
.msg:empty{display:none}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:0;min-width:0;flex:1}
.tab[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tab .t-kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tab .t-time{font-family:var(--label);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tab .t-lines{display:flex;gap:3px;margin-top:3px}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.summary b{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr;column-gap:12px;position:relative}
.step .gut{display:flex;flex-direction:column;align-items:center}
.step .node{width:16px;height:16px;border-radius:50%;background:var(--dot);border:3px solid var(--ink);margin-top:3px;flex:none}
.step .bar{flex:1;width:6px;border-radius:3px;min-height:24px;margin-block:2px}
.step .bar.walk{width:0;border-left:3px dotted var(--muted);border-radius:0}
.step .body{padding-bottom:14px;min-width:0}
.step .st{font-weight:600}
.step .sub{font-size:14px;color:var(--muted)}
.step .leg{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:2px}
.step details{font-size:14px;color:var(--muted);margin-top:4px}
.step summary{cursor:pointer;width:max-content}
.step details ol{margin:4px 0 0;padding-left:18px}

.legend h2,.results h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.legend button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.legend button:hover{background:var(--field)}
.legend button[aria-pressed="true"]{background:var(--field);box-shadow:inset 0 0 0 1px var(--rule)}
.legend .kind{margin-left:auto;font-size:12px;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:14px}

.mapwrap{position:relative;border-radius:14px;overflow:hidden;background:var(--map);border:1px solid var(--rule);min-height:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
.ctrls{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.ctrls button{width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);cursor:pointer;font-size:18px;font-weight:600;display:grid;place-items:center}
.ctrls button:hover{background:var(--field)}
.hint{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:flex-start;pointer-events:none}
.hint span{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}

#base{transition:opacity .25s ease,filter .25s ease}
#base.dim{opacity:var(--dim);filter:grayscale(1)}
.lbl{font-family:var(--label);font-size:17px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:5px;stroke-linejoin:round}
.lbl.x{font-weight:700;font-size:18px}
.lbl.hub{font-size:22px;font-weight:700}
.hit{fill:transparent;cursor:pointer}
.stn{fill:var(--dot)}
.conn-o{stroke:var(--ink)}
.conn-i{stroke:var(--dot)}
.route-lbl{font-weight:700}
.pin-m{fill:var(--ink)}
.route-hit{fill:none;stroke:transparent;stroke-width:36;stroke-linecap:round;stroke-linejoin:round;cursor:grab;pointer-events:stroke}
.via-m{cursor:grab}
.ghost{stroke:var(--ink);stroke-width:4;stroke-dasharray:10 9;fill:none;stroke-linecap:round}
.ghost-dot{fill:var(--ink)}
.snap{fill:none;stroke:var(--focus);stroke-width:5}
.snap-lbl{font-family:var(--label);font-size:22px;font-weight:700;fill:var(--focus);paint-order:stroke;stroke:var(--map);stroke-width:6px;stroke-linejoin:round}
.vias{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.vias .lbl-t{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);background:var(--field);border-radius:999px;padding:3px 4px 3px 10px;font-weight:600;font-size:13px}
.chip button{border:0;background:none;width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.chip button:hover{background:var(--rule);color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.tip{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--field);border-radius:10px;padding:8px 10px;margin:0}
.tip svg{flex:none;margin-top:1px}
.pin-t{fill:var(--map);font-family:var(--ui);font-size:15px;font-weight:700}

@media (max-width:820px){
  html,body{height:auto}
  /* phone: search + routes, then the map, then the line key */
  .app{display:flex;flex-direction:column;gap:12px;height:auto;padding:12px 16px}
  .panel,.panel-scroll{display:contents}
  .p-top,.p-bottom{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:16px;gap:16px}
  .p-top{order:1}
  .mapwrap{order:2;height:64vh;min-height:380px;flex:none}
  .p-bottom{order:3}
  h1{font-size:24px}
  .tab{padding:7px 10px}
  .tab .t-time{font-size:18px}
  .ctrls button{width:40px;height:40px}
}
@media (prefers-reduced-motion: reduce){ #base{transition:none} }
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="app">
  <aside class="panel" aria-label="Trip planner">
    <div class="panel-scroll">
     <div class="p-top">
      <div class="brand">
        <span class="eyebrow">Klang Valley integrated rail</span>
        <h1>Route Finder</h1>
      </div>

      <form id="tripForm" class="trip" autocomplete="off" novalidate>
        <div class="pins"><span class="pin">A</span><span class="pin b">B</span></div>
        <div class="field" style="grid-column:2;grid-row:1">
          <label for="fromInput">From</label>
          <input id="fromInput" type="text" placeholder="Starting station" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="fromList" spellcheck="false">
          <button type="button" class="clear-x" data-clear="fromInput" aria-label="Clear origin">×</button>
          <ul class="suggest" id="fromList" role="listbox" hidden></ul>
        </div>
        <div class="field" style="grid-column:2;grid-row:2">
          <label for="toInput">To</label>
          <input id="toInput" type="text" placeholder="Destination station" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="toList" spellcheck="false">
          <button type="button" class="clear-x" data-clear="toInput" aria-label="Clear destination">×</button>
          <ul class="suggest" id="toList" role="listbox" hidden></ul>
        </div>
        <button type="button" class="swap" id="swapBtn" aria-label="Swap origin and destination" title="Swap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M21 16l-4 4-4-4"/></svg>
        </button>
      </form>
      <div class="actions">
        <button class="btn" id="searchBtn" type="submit" form="tripForm">Search route</button>
        <button class="btn ghost" id="resetBtn" type="button">Reset</button>
      </div>
      <p class="msg" id="msg" role="alert"></p>

      <section class="results" id="results" aria-live="polite" hidden></section>
     </div>
     <div class="p-bottom">

      <section class="legend">
        <h2>Lines</h2>
        <ul id="legend"></ul>
      </section>
      <p class="note">Travel times are estimates that include average waiting and walking time. Tap a station on the map to use it as your origin or destination.</p>
     </div>
    </div>
  </aside>

  <main class="mapwrap">
    <svg id="map" role="img" aria-label="Klang Valley integrated transit map" preserveAspectRatio="xMidYMid meet">
      <g id="base"></g>
      <g id="overlay"></g>
      <g id="hits"></g>
      <g id="routeHits"></g>
      <g id="drag" pointer-events="none"></g>
    </svg>
    <div class="ctrls">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zfit" aria-label="Fit to view" title="Fit">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <div class="hint"><span id="hint">Drag to pan, scroll or pinch to zoom</span></div>
  </main>
</div>

const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function roundedPath(pts,R=38){
  const P=pts.filter((p,i)=>i===0||Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1])>0.5);
  if(P.length<2) return `M${P[0][0]},${P[0][1]}`;
  let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=1;i<P.length-1;i++){
    const [ax,ay]=P[i-1],[bx,by]=P[i],[cx,cy]=P[i+1];
    const v1=[bx-ax,by-ay],v2=[cx-bx,cy-by],l1=Math.hypot(...v1),l2=Math.hypot(...v2);
    const cross=Math.abs(v1[0]*v2[1]-v1[1]*v2[0])/(l1*l2);
    if(cross<0.02){ d+=` L${bx},${by}`; continue; }
    const r=Math.min(R,l1/2,l2/2);
    const p1=[bx-v1[0]/l1*r,by-v1[1]/l1*r],p2=[bx+v2[0]/l2*r,by+v2[1]/l2*r];
    d+=` L${p1[0].toFixed(1)},${p1[1].toFixed(1)} Q${bx},${by} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const z=P[P.length-1]; return d+` L${z[0]},${z[1]}`;
}
function wrapName(n){
  if(n.length<=10||!n.includes(' ')) return [n];
  let best=-1,bd=1e9; for(let i=0;i<n.length;i++) if(n[i]===' '&&Math.abs(i-n.length/2)<bd){bd=Math.abs(i-n.length/2);best=i;}
  return [n.slice(0,best),n.slice(best+1)];
}
function makeLabel(s,side,parent,bold){
  const g=el('g',{},parent);
  const multi=['t','b','tr','tl','br','bl'].includes(side);
  const lines=multi?wrapName(s.name):[s.name];
  const LH=19; let x=s.x,y=s.y,anchor='start',ys=[];
  const n=lines.length;
  switch(side){
    case 'l': x-=15; anchor='end'; ys=[y+6]; break;
    case 'R': x+=60; ys=[y+6]; break;
    case 't': anchor='middle'; ys=lines.map((_,k)=>y-17-(n-1-k)*LH); break;
    case 'b': anchor='middle'; ys=lines.map((_,k)=>y+30+k*LH); break;
    case 'tr': x+=10; ys=lines.map((_,k)=>y-15-(n-1-k)*LH); break;
    case 'tl': x-=10; anchor='end'; ys=lines.map((_,k)=>y-15-(n-1-k)*LH); break;
    case 'br': x+=10; ys=lines.map((_,k)=>y+30+k*LH); break;
    case 'bl': x-=10; anchor='end'; ys=lines.map((_,k)=>y+30+k*LH); break;
    default: x+=15; ys=[y+6];
  }
  lines.forEach((t,k)=>{ const te=el('text',{x,y:ys[k],'text-anchor':anchor,class:'lbl'+(bold?' x':'')},g); te.textContent=t; });
  return g;
}
// minimum spanning set of links between positions (for stacked interchange dots)
function mstPairs(ps){
  const out=[],inT=[0]; const rest=ps.map((_,i)=>i).slice(1);
  while(rest.length){ let bi=-1,bj=-1,bd=1e9;
    inT.forEach(i=>rest.forEach(j=>{const d=Math.hypot(ps[i][0]-ps[j][0],ps[i][1]-ps[j][1]); if(d<bd){bd=d;bi=i;bj=j;}}));
    out.push([ps[bi],ps[bj]]); inT.push(bj); rest.splice(rest.indexOf(bj),1); }
  return out;
}

function edgeCost(L,a,b){ if(L.cost){ const k1=a+'~'+b,k2=b+'~'+a; if(L.cost[k1]!=null) return L.cost[k1]; if(L.cost[k2]!=null) return L.cost[k2]; } return L.ride; }
function route(from,to,opt={}){

  STN.get(from).occ.forEach(o=>{ if(!ban.has(o.li)) push(from,o.li,LINES[o.li].wait/2,null); });
  const done=new Set(); let goal=null;
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i][0]<open[bi][0]) bi=i;
    const [c,sid,li]=open.splice(bi,1)[0]; const k=key(sid,li);
    if(done.has(k)) continue; done.add(k);
    if(sid===to){ goal=k; break; }
    const L=LINES[li], si=L.idx.get(sid);
    [si-1,si+1].forEach(nj=>{ if(nj<0||nj>=L.stops.length) return; const n=L.stops[nj]; push(n.id,li,c+edgeCost(L,sid,n.id),{k,type:'ride',li,from:si,to:nj}); });
    if(!banX.has(sid)){
      STN.get(sid).occ.forEach(o=>{ if(o.li!==li&&!ban.has(o.li)) push(sid,o.li,c+3+LINES[o.li].wait/2,{k,type:'change',at:sid,fromLi:li}); });
      (WALKMAP.get(sid)||[]).forEach(w=>{ if(banX.has(w)) return; STN.get(w).occ.forEach(o=>{ if(!ban.has(o.li)) push(w,o.li,c+6+LINES[o.li].wait/2,{k,type:'walk',from:sid,to:w,fromLi:li}); }); });
    }
  }
  if(!goal) return null;

  const ev=[]; let k=goal; while(prev.get(k)){ const p=prev.get(k); ev.unshift(p); k=p.k; }
  const legs=[],links=[]; let cur=null, pendingLink=null;
  ev.forEach(e=>{
    if(e.type==='ride'){
      if(cur&&cur.li===e.li){ cur.to=e.to; }
      else { if(cur) legs.push(cur); cur={li:e.li,from:e.from,to:e.to,linkBefore:pendingLink}; pendingLink=null; }
    } else if(e.type==='walk'){ pendingLink={type:'walk',from:e.from,to:e.to}; }

    h+=`<li class="step"><div class="gut"><span class="node"></span><span class="bar walk"></span></div><div class="body"><div class="st">${nm(r.from)}</div><div class="sub">Walk via the linked walkway</div></div></li>`; }
  r.legs.forEach((g,i)=>{ const L=LINES[g.li]; const s=L.stops[g.from], e=L.stops[g.to]; const toward=g.to>g.from?L.stops[L.stops.length-1].name:L.stops[0].name;
    const n=Math.abs(g.to-g.from); const step=g.from<g.to?1:-1; const mid=[]; for(let j=g.from+step;j!==g.to;j+=step) mid.push(L.stops[j].name+(viaSet.has(L.stops[j].name)?' (via)':''));
    let lead='';
    if(i===0) lead=lg0.linkBefore&&lg0.linkBefore.type==='walk'?'Board here':'Start';
    else { const lb=g.linkBefore; lead=lb&&lb.type==='walk'?`Walk from ${nm(lb.from)} to this station, then board`:r.legs[i-1].li===g.li?'Stay on this line and ride back the other way':'Change here'; }
    h+=`<li class="step"><div class="gut"><span class="node"></span><span class="bar" style="background:${L.color}"></span></div><div class="body">
      <div class="st">${esc(s.name)}</div><div class="sub">${lead}</div>
      <div class="leg">${badgeHTML(L,true)}<span>${esc(L.name)}</span></div>
      <div class="sub">Toward ${esc(toward)} · ${n} ${n===1?'stop':'stops'}</div>
      ${mid.length?`<details><summary>${mid.length} intermediate ${mid.length===1?'station':'stations'}</summary><ol>${mid.map(m=>`<li>${esc(m)}</li>`).join('')}</ol></details>`:''}
    </div></li>`;
  });
  const last=r.legs[r.legs.length-1], lastStop=LINES[last.li].stops[last.to];
  if(r.tail&&r.tail.type==='walk'){
    h+=`<li class="step"><div class="gut"><span class="node"></span><span class="bar walk"></span></div><div class="body"><div class="st">${esc(lastStop.name)}</div><div class="sub">Alight and walk via the linked walkway</div></div></li>`; }
  h+=`<li class="step"><div class="gut"><span class="node" style="background:var(--ink)"></span></div><div class="body"><div class="st">${nm(r.to)}</div><div class="sub">Arrive</div></div></li></ol></details>`;
  d.innerHTML=h;
  d.querySelector('.stepwrap').addEventListener('toggle',e=>{ stepsOpen=e.target.open; });
  d.querySelectorAll('[data-rmvia]').forEach(b=>b.onclick=()=>{ const v=vias.slice(); v.splice(+b.dataset.rmvia,1); setCustom(v.length?routeVia([r.from,...v,r.to]):null); });
  const dc=d.querySelector('#discardCustom'); if(dc) dc.onclick=()=>setCustom(null);
}
/* ---------- Custom route (drag to reroute) ---------- */
function setCustom(r){
  routes=baseRoutes.slice();
  if(r){ r.custom=true; routes.push(r); sel=routes.length-1; } else sel=0;
  renderResults(); showRoute(sel,false);
}
function applyVia(sid,moveIdx){
  const r=routes[sel]; const pts=r.points||[r.from,r.to]; const from=pts[0], to=pts[pts.length-1], vias=pts.slice(1,-1);
  if(sid===from||sid===to){ msg('That station is already the start or end of this trip. Drop the route on a different station.'); return; }
  let best=null;
  if(moveIdx!=null){ const v=vias.slice(); v[moveIdx]=sid; if(v.filter(x=>x===sid).length>1){ msg('The route already goes via that station.'); return; } best=routeVia([from,...v,to]); }
  else {
    if(vias.includes(sid)){ msg('The route already goes via that station.'); return; }
    if(vias.length>=5){ msg('A route can have up to 5 via stations. Remove one first.'); return; }
    for(let i=0;i<=vias.length;i++){ const v=vias.slice(); v.splice(i,0,sid); const c=routeVia([from,...v,to]); if(c&&(!best||c.cost<best.cost)) best=c; }
  }
  if(!best){ msg(`No rail route could be found via ${STN.get(sid).name}.`); return; }
  msg(''); setCustom(best);
}
const SNAP=[]; STN.forEach(S=>S.occ.forEach(o=>{ const [x,y]=stopPos(o.li,o.si); SNAP.push({id:S.id,x,y}); }));
function nearestStation(p,px){ const lim=px/svg.getScreenCTM().a; let best=null,bd=lim;
  SNAP.forEach(s=>{ const d=Math.hypot(s.x-p.x,s.y-p.y); if(d<bd){ bd=d; best=s; } }); return best; }
let rdrag=null;
routeHits.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0) return;
  const via=e.target.closest('.via-m'); const hit=via||e.target.closest('.route-hit'); if(!hit) return;
  e.stopPropagation(); e.preventDefault(); cancelAnimationFrame(anim);
  const p0=toSvg(e.clientX,e.clientY);
  rdrag={id:e.pointerId,sx:e.clientX,sy:e.clientY,p0,moveIdx:via?+via.dataset.via:null,moved:false,snap:null};
  if(via){ const c=via.querySelector('circle'); rdrag.p0={x:+c.getAttribute('cx'),y:+c.getAttribute('cy')}; }
  svg.classList.add('dragging');
});
window.addEventListener('pointermove',e=>{
  if(!rdrag||e.pointerId!==rdrag.id) return;
  if(!rdrag.moved&&Math.hypot(e.clientX-rdrag.sx,e.clientY-rdrag.sy)<6) return;
  rdrag.moved=true; const p=toSvg(e.clientX,e.clientY); const sn=nearestStation(p,34); rdrag.snap=sn;
  dragG.replaceChildren(); const q=sn||p;
  el('path',{d:`M${rdrag.p0.x},${rdrag.p0.y} L${q.x},${q.y}`,class:'ghost'},dragG);
  if(sn){ el('circle',{cx:sn.x,cy:sn.y,r:20,class:'snap'},dragG); const t=el('text',{x:sn.x+26,y:sn.y-18,class:'snap-lbl'},dragG); t.textContent='Via '+STN.get(sn.id).name; hint(`Release to travel via ${STN.get(sn.id).name}`); }
  else { el('circle',{cx:p.x,cy:p.y,r:9,class:'ghost-dot'},dragG); hint('Drop the route on a station'); }
});
const endRouteDrag=e=>{
  if(!rdrag||e.pointerId!==rdrag.id) return;
  const d=rdrag; rdrag=null; dragG.replaceChildren(); svg.classList.remove('dragging');
  if(e.type==='pointercancel') return;
  if(!d.moved){ const s=nearestStation(d.p0,24); if(s) stationTap(s.id); return; }
  if(d.snap) applyVia(d.snap.id,d.moveIdx); else hint('Drop the route on a station to reroute it.');
};
window.addEventListener('pointerup',endRouteDrag); window.addEventListener('pointercancel',endRouteDrag);
function hint(t){ document.getElementById('hint').textContent=t; }

/* ---------- Legend ---------- */
const legendEl=document.getElementById('legend');
legendEl.innerHTML=LINES.map((L,i)=>`<li><button type="button" data-li="${i}" aria-pressed="false">${badgeHTML(L,true)}<span>${esc(L.name)}</span><span class="kind">${L.stops.length}</span></button></li>`).join('');
function setLegend(li){ legendEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.li===li))); }
legendEl.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const li=+b.dataset.li;
  if(b.getAttribute('aria-pressed')==='true'){ setLegend(null); if(routes.length&&!resultsEl.hidden) showRoute(sel,true); else { clearOverlay(); currentFocus=null; animateTo(FULL); } return; }
  setLegend(li); const box=drawLineFocus(li); currentFocus=box; animateTo(box); hint(`Showing ${LINES[li].name}. Tap it again to go back.`); });

/* ---------- Tap stations on the map ---------- */
hits.addEventListener('click',e=>{ if(moved>8) return; const c=e.target.closest('[data-sid]'); if(!c) return; stationTap(c.dataset.sid); });
function stationTap(id){
  if(!fromInput.dataset.sid||(fromInput.dataset.sid&&toInput.dataset.sid)){ setField(fromInput,id); toInput.value=''; delete toInput.dataset.sid; msg(''); hint(`Origin set to ${STN.get(id).name}. Tap a destination.`); }
  else { setField(toInput,id); search(); }
}

/* ---------- Boot ---------- */
drawBase(); applyVB();
setField(fromInput,EXAMPLE[0]); setField(toInput,EXAMPLE[1]); search();
hint('Example trip loaded. Search your own route in the panel.');
</script>
